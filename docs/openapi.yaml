openapi: 3.0.3
info:
  title: Clawforge API
  version: 0.10.0
  description: Backend-only intelligence, incident, and administration API.
  x-rate-limit-contract: Responses may include X-RateLimit-Limit and X-RateLimit-Remaining; 429 responses include Retry-After.
  x-response-contract: Every JSON endpoint returns status, data, timestamp, pagination, and errors.
servers:
  - url: http://localhost:8080
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque-session-or-api-token
    agentBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque-agent-api-token
      description: Agent token issued by an Administrator. Tokens are read-only and carry explicit agent scopes.
  schemas:
    ApiEnvelope:
      type: object
      required: [status, data, timestamp, pagination, errors]
      properties:
        status: { type: string, example: ok }
        data: {}
        timestamp: { type: string, format: date-time }
        pagination:
          oneOf:
            - $ref: '#/components/schemas/Pagination'
            - type: 'null'
        errors:
          type: array
          items: { type: string }
    Pagination:
      type: object
      required: [page, page_size, total, has_next]
      properties:
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1, maximum: 500 }
        total: { type: integer, minimum: 0 }
        has_next: { type: boolean }
    AgentStatus:
      type: object
      required: [service, version, status, migrations, runtime, events, providers]
      properties:
        service: { type: string, example: clawforge }
        version: { type: string, example: 0.10.0 }
        status: { type: string, enum: [ok] }
        migrations: { type: object, additionalProperties: true }
        runtime: { type: array, items: { type: object, additionalProperties: true } }
        events: { type: object, additionalProperties: true }
        providers: { type: object, additionalProperties: true }
    AgentHealthStatus:
      type: object
      required: [status, components, agent]
      properties:
        status: { type: string, enum: [healthy, degraded] }
        components: { type: array, items: { type: object, additionalProperties: true } }
        agent: { type: object, additionalProperties: true }
    AgentContext:
      type: object
      required: [system, active_incidents, open_incident_severity, risk_scores, trust, important_events, correlations]
      properties:
        system: { type: object, additionalProperties: true }
        active_incidents: { type: object, additionalProperties: true }
        open_incident_severity: { type: object, additionalProperties: true }
        risk_scores: { type: object, additionalProperties: true }
        trust: { type: object, additionalProperties: true }
        important_events: { type: array, items: { $ref: '#/components/schemas/AgentEvent' } }
        correlations: { type: object, additionalProperties: true }
    AgentDecision:
      type: object
      required: [overall_status, risk_assessment, attention_points, recommended_checks, context]
      properties:
        overall_status: { type: string, enum: [info, low, medium, high, critical] }
        risk_assessment: { type: object, additionalProperties: true }
        attention_points: { type: array, items: { type: object, additionalProperties: true } }
        recommended_checks: { type: array, items: { type: object, additionalProperties: true } }
        context: { $ref: '#/components/schemas/AgentContext' }
    AgentProviderStatus:
      type: object
      required: [id, name, type, status, quality_score]
      properties:
        id: { type: string }
        name: { type: string }
        type: { type: string }
        source: { type: string }
        status: { type: string, enum: [ok, error, running, disabled, unknown] }
        enabled: { type: boolean }
        last_success: { type: string, format: date-time, nullable: true }
        last_failure: { type: string, format: date-time, nullable: true }
        last_error: { type: string, nullable: true }
        data_age: { type: number, nullable: true }
        data_age_seconds: { type: number, nullable: true }
        quality_score: { type: integer, minimum: 0, maximum: 100 }
        indicator_count: { type: integer, minimum: 0 }
        sync_duration_ms: { type: integer, minimum: 0 }
    OperationsSummary:
      type: object
      required: [overall_status, risk_level, active_incidents, critical_events, provider_health, attention_points, recommended_checks]
      properties:
        overall_status: { type: string, enum: [info, low, medium, high, critical] }
        risk_level: { type: string, enum: [info, low, medium, high, critical] }
        active_incidents: { type: integer, minimum: 0 }
        critical_events: { type: integer, minimum: 0 }
        provider_health: { type: object, additionalProperties: true }
        attention_points: { type: array, items: { type: object, additionalProperties: true } }
        recommended_checks: { type: array, items: { type: object, additionalProperties: true } }
        correlation_confidence: { type: object, additionalProperties: true }
        trust: { type: object, additionalProperties: true }
        alerts: { type: object, additionalProperties: { type: integer, minimum: 0 } }
        system_status: { type: string, enum: [ok, degraded, unavailable] }
    OperationsBriefing:
      type: object
      required: [timestamp, overall_status, risk_level, active_incidents, active_alerts, recent_events, provider_health, security_changes, attention_points, recommended_checks]
      properties:
        timestamp: { type: string, format: date-time }
        overall_status: { type: string }
        risk_level: { type: string }
        active_incidents: { type: object, additionalProperties: true }
        active_alerts: { type: object, additionalProperties: true }
        recent_events: { type: array, items: { $ref: '#/components/schemas/AgentEvent' } }
        provider_health: { type: object, additionalProperties: true }
        security_changes: { type: object, additionalProperties: true }
        attention_points: { type: array, items: { type: object, additionalProperties: true } }
        recommended_checks: { type: array, items: { type: object, additionalProperties: true } }
    DecisionRecommendation:
      type: object
      required: [id, severity, category, source, title, reason, recommendation, confidence, status]
      properties:
        id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        severity: { type: string, enum: [info, low, medium, high, critical] }
        category: { type: string }
        source: { type: string }
        title: { type: string }
        description: { type: string }
        reason: { type: string }
        recommendation: { type: string }
        confidence: { type: number, minimum: 0, maximum: 1 }
        status: { type: string, enum: [open, acknowledged, dismissed, resolved, expired] }
        related_incident_id: { type: string, format: uuid, nullable: true }
    WorkflowStep:
      type: object
      required: [id, name, step_order, type, required_approval]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        step_order: { type: integer, minimum: 1 }
        type: { type: string, enum: [notification, analysis, approval, external_check, manual] }
        required_approval: { type: boolean }
        created_at: { type: string, format: date-time }
    Workflow:
      type: object
      required: [id, name, description, category, enabled, steps]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        category: { type: string }
        enabled: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        steps: { type: array, items: { $ref: '#/components/schemas/WorkflowStep' } }
        runs: { type: array, items: { $ref: '#/components/schemas/WorkflowRun' } }
        audit: { type: array, items: { $ref: '#/components/schemas/WorkflowAudit' } }
    WorkflowRun:
      type: object
      required: [id, workflow_id, status, started_at]
      properties:
        id: { type: string, format: uuid }
        workflow_id: { type: string, format: uuid }
        workflow_name: { type: string }
        category: { type: string }
        decision_id: { type: string, format: uuid, nullable: true }
        status: { type: string, enum: [pending, running, waiting_approval, completed, failed, cancelled] }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time, nullable: true }
    WorkflowAudit:
      type: object
      required: [id, workflow_id, actor, action, timestamp]
      properties:
        id: { type: string, format: uuid }
        workflow_id: { type: string, format: uuid }
        actor: { type: string }
        action: { type: string }
        timestamp: { type: string, format: date-time }
    ConnectorCapability:
      type: object
      required: [name, read_only]
      properties:
        name: { type: string }
        read_only: { type: boolean, example: true }
    Connector:
      type: object
      required: [id, name, version, type, status, health, read_only, capabilities]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        version: { type: string }
        type: { type: string, enum: [docker, github, proxmox] }
        status: { type: string, enum: [configured, healthy, degraded, unavailable, disabled] }
        health: { type: string, enum: [unknown, healthy, degraded, unavailable] }
        last_check: { type: string, format: date-time, nullable: true }
        health_checked_at: { type: string, format: date-time, nullable: true }
        latency_ms: { type: integer, nullable: true }
        description: { type: string }
        read_only: { type: boolean, example: true }
        capabilities: { type: array, items: { $ref: '#/components/schemas/ConnectorCapability' } }
    SecurityPosture:
      type: object
      required: [risk_level, incident_count, alert_count, provider_status, policy_status, trust_summary, trend]
      properties:
        risk_level: { type: string }
        incident_count: { type: integer, minimum: 0 }
        alert_count: { type: integer, minimum: 0 }
        provider_status: { type: array, items: { $ref: '#/components/schemas/AgentProviderStatus' } }
        policy_status: { type: object, additionalProperties: true }
        trust_summary: { type: object, additionalProperties: true }
        trend: { type: object, additionalProperties: true }
    KnowledgeEntry:
      type: object
      required: [id, type, title, summary, source, created_at]
      properties:
        id: { type: integer }
        type: { type: string, enum: [incident, lesson_learned, pattern] }
        title: { type: string }
        summary: { type: string }
        source: { type: string }
        created_at: { type: string, format: date-time }
    ProviderHistory:
      type: object
      required: [id, provider_id, status, timestamp, quality_score, indicator_count, sync_duration_ms]
      properties:
        id: { type: integer }
        provider_id: { type: string }
        status: { type: string }
        timestamp: { type: string, format: date-time }
        last_error: { type: string, nullable: true }
        quality_score: { type: integer, minimum: 0, maximum: 100 }
        data_age_seconds: { type: number, nullable: true }
        indicator_count: { type: integer, minimum: 0 }
        sync_duration_ms: { type: integer, minimum: 0 }
    Alert:
      type: object
      required: [id, source, severity, status, created_at, delivery_status, summary]
      properties:
        id: { type: string, format: uuid }
        source: { type: string }
        severity: { type: string, enum: [info, low, medium, high, critical] }
        status: { type: string, enum: [open, acknowledged, resolved, suppressed] }
        created_at: { type: string, format: date-time }
        acknowledged_at: { type: string, format: date-time, nullable: true }
        delivery_status: { type: string, enum: [pending, sent, partial, failed, not_configured] }
        incident_id: { type: string, format: uuid, nullable: true }
        summary: { type: string }
    AgentEvent:
      type: object
      required: [event_id, event_type, source, severity, timestamp]
      properties:
        event_id: { type: string, format: uuid }
        event_type: { type: string }
        source: { type: string }
        severity: { type: string }
        timestamp: { type: string, format: date-time }
        correlation_id: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
    AgentFinding:
      type: object
      required: [id, kind, subject, source, severity, confidence, status]
      properties:
        id: { type: string, example: indicator:123 }
        kind: { type: string }
        subject: { type: string }
        source: { type: string }
        severity: { type: string, enum: [info, low, medium, high, critical] }
        confidence: { type: integer, minimum: 0, maximum: 100 }
        risk_score: { type: integer, minimum: 0, maximum: 100, nullable: true }
        trust_score: { type: integer, minimum: -100, maximum: 0, nullable: true }
        reason: { type: string, nullable: true }
        first_seen: { type: string, format: date-time }
        last_seen: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        age_seconds: { type: number, nullable: true }
        status: { type: string, enum: [active, expired] }
        assessed_at: { type: string, format: date-time, nullable: true }
    AgentTrustNetwork:
      type: object
      required: [id, name, type, identifier, status, timestamp, confidence, trust_score]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type: { type: string }
        identifier: { type: string }
        source: { type: string, example: trusted_registry }
        status: { type: string, enum: [Pending, Verified, Revoked] }
        created_at: { type: string, format: date-time }
        verified_at: { type: string, format: date-time, nullable: true }
        timestamp: { type: string, format: date-time }
        age_seconds: { type: number, nullable: true }
        confidence: { type: integer, minimum: 0, maximum: 100 }
        trust_score: { type: integer, minimum: -100, maximum: 0 }
        assessment: { type: object, additionalProperties: true }
  responses:
    RateLimited:
      description: Endpoint or global rate limit exceeded.
      headers:
        Retry-After:
          description: Seconds until the client may retry.
          schema: { type: integer, minimum: 1 }
        X-RateLimit-Limit:
          description: Requests allowed in the current endpoint window.
          schema: { type: integer, minimum: 1 }
        X-RateLimit-Remaining:
          description: Requests remaining in the current endpoint window.
          schema: { type: integer, minimum: 0 }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiEnvelope' }
paths:
  /api/v1/status:
    get:
      security: [{ agentBearerAuth: [] }]
      description: Read-only operational status for OpenClaw-compatible agents.
      responses:
        '200':
          description: Agent status envelope
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiEnvelope' }
        '401': { description: Agent token missing or invalid }
        '403': { description: Required agent scope missing }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { description: PostgreSQL or migration status unavailable }
  /api/v1/agents/status:
    get:
      security: [{ agentBearerAuth: [] }]
      description: Read-only health and access status for agent integrations. Requires agent:system:read.
      responses:
        '200':
          description: Agent health envelope
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AgentHealthStatus' }
        '401': { description: Agent token missing or invalid }
        '403': { description: agent:system:read scope missing }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { description: Runtime status unavailable }
  /api/v1/context:
    get:
      security: [{ agentBearerAuth: [] }]
      description: Consolidated, read-only operational context for agents. Requires agent:context:read. Raw payloads, secrets, trust registry internals, candidate IDs, and correlation keys are omitted.
      responses:
        '200':
          description: Consolidated agent context envelope
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AgentContext' }
        '401': { description: Agent token missing or invalid }
        '403': { description: agent:context:read scope missing }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { description: PostgreSQL or context dependency unavailable }
  /api/v1/providers:
    get:
      security: [{ agentBearerAuth: [] }]
      description: Paginated, normalized provider health without raw feed data. Requires agent:provider:read.
      parameters:
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: page_size, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { in: query, name: source, schema: { type: string } }
        - { in: query, name: status, schema: { type: string } }
      responses:
        '200':
          description: Provider status envelope
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/AgentProviderStatus' } }
        '401': { description: Agent token missing or invalid }
        '403': { description: agent:provider:read scope missing }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { description: Provider status unavailable }
  /api/v1/providers/{id}/history:
    get:
      security: [{ agentBearerAuth: [] }]
      description: Read-only normalized provider quality and synchronization history. Raw feeds and credentials are never returned. Requires agent:provider:read.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: page_size, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { in: query, name: from, schema: { type: string, format: date-time } }
        - { in: query, name: to, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: Provider history envelope
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/ProviderHistory' } }
        '400': { description: Invalid provider identifier }
        '401': { description: Agent token missing or invalid }
        '403': { description: agent:provider:read scope missing }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { description: Provider history unavailable }
  /api/v1/decisions:
    get:
      security: [{ agentBearerAuth: [] }]
      description: Read-only operational decision summary derived from existing agent context, incident, risk, trust, and correlation data. Requires agent:decision:read. No new risk calculation or automatic action is performed.
      responses:
        '200':
          description: Prioritized agent decision envelope
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AgentDecision' }
        '401': { description: Agent token missing or invalid }
        '403': { description: agent:decision:read scope missing }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { description: PostgreSQL or decision dependency unavailable }
  /api/v1/operations/summary:
    get:
      security: [{ agentBearerAuth: [] }]
      description: High-level read-only operations summary derived from existing context, incidents, risk, trust, events, and provider views. Requires agent:operations:read. No action is performed.
      responses:
        '200':
          description: Operations summary envelope
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/OperationsSummary' }
        '401': { description: Agent token missing or invalid }
        '403': { description: agent:operations:read scope missing }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { description: Operations summary unavailable }
  /api/v1/operations/briefing:
    get:
      security: [{ agentBearerAuth: [] }]
      description: Daily read-only operations briefing assembled from existing summaries, incidents, alerts, events, and provider health. Requires agent:operations:briefing.
      responses:
        '200':
          description: Operations briefing envelope
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/OperationsBriefing' }
        '401': { description: Agent token missing or invalid }
        '403': { description: agent:operations:briefing scope missing }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { description: Operations briefing unavailable }
  /api/v1/knowledge:
    get:
      security: [{ agentBearerAuth: [] }]
      description: Read-only historical knowledge summaries. Incident notes, raw payloads, and internal relations are excluded. Requires agent:knowledge:read.
      parameters:
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: page_size, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { in: query, name: from, schema: { type: string, format: date-time } }
        - { in: query, name: to, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: Knowledge context envelope
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/KnowledgeEntry' } }
        '401': { description: Agent token missing or invalid }
        '403': { description: agent:knowledge:read scope missing }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { description: Knowledge storage unavailable }
  /api/v1/operations/recommendations:
    get:
      security: [{ agentBearerAuth: [] }]
      description: Read-only persisted recommendations from the Decision Engine. No automatic action is performed. Requires agent:operations:recommend.
      parameters:
        - { in: query, name: status, schema: { type: string, enum: [open, acknowledged, dismissed, resolved, expired], default: open } }
        - { in: query, name: category, schema: { type: string } }
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: page_size, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200':
          description: Operations recommendations envelope
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/DecisionRecommendation' } }
        '401': { description: Agent token missing or invalid }
        '403': { description: agent:operations:recommend scope missing }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { description: Decision storage unavailable }
  /api/v1/decisions/history:
    get:
      security: [{ agentBearerAuth: [] }]
      description: Read-only history of persisted decisions, including resolved and expired entries. Requires agent:operations:recommend.
      parameters:
        - { in: query, name: status, schema: { type: string, enum: [open, acknowledged, dismissed, resolved, expired] } }
        - { in: query, name: category, schema: { type: string } }
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: page_size, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200':
          description: Decision history envelope
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/DecisionRecommendation' } }
        '401': { description: Agent token missing or invalid }
        '403': { description: agent:operations:recommend scope missing }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { description: Decision history unavailable }
  /api/v1/workflows:
    get:
      security: [{ agentBearerAuth: [] }]
      description: Read-only enabled declarative workflows and their steps. No step is executed. Requires agent:workflow:read.
      responses:
        '200':
          description: Workflow definitions
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/Workflow' } }
        '401': { description: Agent token missing or invalid }
        '403': { description: agent:workflow:read scope missing }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/workflows/{id}:
    get:
      security: [{ agentBearerAuth: [] }]
      description: Read-only workflow details, prepared runs, and sanitized audit history. Requires agent:workflow:read.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Workflow detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Workflow' }
