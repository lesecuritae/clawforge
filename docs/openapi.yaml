openapi: 3.0.3
info:
  title: Clawforge API
  version: 0.1.0
  description: Backend-only intelligence, incident, and administration API.
  x-rate-limit-contract: Responses may include X-RateLimit-Limit and X-RateLimit-Remaining; 429 responses include Retry-After.
  x-response-contract: Every JSON endpoint returns status, data, timestamp, pagination, and errors.
servers:
  - url: http://localhost:8080
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque-session-or-api-token
    agentBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque-agent-api-token
      description: Agent token issued by an Administrator. Tokens are read-only and carry explicit agent scopes.
  schemas:
    ApiEnvelope:
      type: object
      required: [status, data, timestamp, pagination, errors]
      properties:
        status: { type: string, example: ok }
        data: {}
        timestamp: { type: string, format: date-time }
        pagination:
          oneOf:
            - $ref: '#/components/schemas/Pagination'
            - type: 'null'
        errors:
          type: array
          items: { type: string }
    Pagination:
      type: object
      required: [page, page_size, total, has_next]
      properties:
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1, maximum: 500 }
        total: { type: integer, minimum: 0 }
        has_next: { type: boolean }
    AgentStatus:
      type: object
      required: [service, version, status, migrations, runtime, events, providers]
      properties:
        service: { type: string, example: clawforge }
        version: { type: string, example: 0.1.0 }
        status: { type: string, enum: [ok] }
        migrations: { type: object, additionalProperties: true }
        runtime: { type: array, items: { type: object, additionalProperties: true } }
        events: { type: object, additionalProperties: true }
        providers: { type: object, additionalProperties: true }
    AgentEvent:
      type: object
      required: [event_id, event_type, source, severity, timestamp]
      properties:
        event_id: { type: string, format: uuid }
        event_type: { type: string }
        source: { type: string }
        severity: { type: string }
        timestamp: { type: string, format: date-time }
        correlation_id: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
    AgentFinding:
      type: object
      required: [id, kind, subject, source, severity, confidence, status]
      properties:
        id: { type: string, example: indicator:123 }
        kind: { type: string }
        subject: { type: string }
        source: { type: string }
        severity: { type: string, enum: [info, low, medium, high, critical] }
        confidence: { type: integer, minimum: 0, maximum: 100 }
        risk_score: { type: integer, minimum: 0, maximum: 100, nullable: true }
        trust_score: { type: integer, minimum: -100, maximum: 0, nullable: true }
        reason: { type: string, nullable: true }
        first_seen: { type: string, format: date-time }
        last_seen: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        age_seconds: { type: number, nullable: true }
        status: { type: string, enum: [active, expired] }
        assessed_at: { type: string, format: date-time, nullable: true }
    AgentTrustNetwork:
      type: object
      required: [id, name, type, identifier, status, timestamp, confidence, trust_score]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type: { type: string }
        identifier: { type: string }
        source: { type: string, example: trusted_registry }
        status: { type: string, enum: [Pending, Verified, Revoked] }
        created_at: { type: string, format: date-time }
        verified_at: { type: string, format: date-time, nullable: true }
        timestamp: { type: string, format: date-time }
        age_seconds: { type: number, nullable: true }
        confidence: { type: integer, minimum: 0, maximum: 100 }
        trust_score: { type: integer, minimum: -100, maximum: 0 }
        assessment: { type: object, additionalProperties: true }
  responses:
    RateLimited:
      description: Endpoint or global rate limit exceeded.
      headers:
        Retry-After:
          description: Seconds until the client may retry.
          schema: { type: integer, minimum: 1 }
        X-RateLimit-Limit:
          description: Requests allowed in the current endpoint window.
          schema: { type: integer, minimum: 1 }
        X-RateLimit-Remaining:
          description: Requests remaining in the current endpoint window.
          schema: { type: integer, minimum: 0 }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiEnvelope' }
paths:
  /api/v1/status:
    get:
      security: [{ agentBearerAuth: [] }]
      description: Read-only operational status for OpenClaw-compatible agents.
      responses:
        '200':
          description: Agent status envelope
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiEnvelope' }
        '401': { description: Agent token missing or invalid }
        '403': { description: Required agent scope missing }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { description: PostgreSQL or migration status unavailable }
  /admin/auth/agent-tokens:
    post:
      security: [{ bearerAuth: [] }]
      description: Issue a short-lived, read-only agent token. The token value is returned only once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, scopes]
              properties:
                name: { type: string, minLength: 1, maxLength: 128 }
                scopes:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    enum: [agent:system:read, agent:events:read, agent:incidents:read, agent:security:read, agent:network:read, agent:read]
                expires_in_hours: { type: integer, minimum: 1, maximum: 8760, default: 720 }
      responses:
        '200': { description: Token envelope; the secret is not persisted and is shown once }
        '400': { description: Invalid token name, scope, or lifetime }
        '401': { description: Administrator credential missing or invalid }
        '403': { description: Administrator role required }
        '503': { description: Token storage unavailable }
  /admin/auth/agent-tokens/{id}/revoke:
    post:
      security: [{ bearerAuth: [] }]
      description: Revoke an agent token. This endpoint never returns the token value.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Revocation envelope }
        '401': { description: Administrator credential missing or invalid }
        '403': { description: Administrator role required }
        '404': { description: Token not found }
        '503': { description: Token storage unavailable }
  /api/v1/events:
    get:
      security: [{ agentBearerAuth: [] }]
      description: Read-only canonical events with secret and raw-payload fields removed.
      parameters:
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: page_size, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { in: query, name: event_type, schema: { type: string } }
        - { in: query, name: source, schema: { type: string } }
        - { in: query, name: severity, schema: { type: string } }
        - { in: query, name: correlation_id, schema: { type: string } }
        - { in: query, name: from, schema: { type: string, format: date-time } }
        - { in: query, name: to, schema: { type: string, format: date-time } }
      responses:
        '200': { description: Paginated agent event envelope }
        '401': { description: Agent token missing or invalid }
        '403': { description: Required agent scope missing }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { description: Event storage unavailable }
  /api/v1/incidents:
    get:
      security: [{ agentBearerAuth: [] }]
      description: Read-only incident list.
      parameters:
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: page_size, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { in: query, name: status, schema: { type: string, enum: [Open, Investigating, Resolved, Ignored] } }
        - { in: query, name: severity, schema: { type: string } }
        - { in: query, name: from, schema: { type: string, format: date-time } }
        - { in: query, name: to, schema: { type: string, format: date-time } }
      responses:
        '200': { description: Paginated agent incident envelope }
        '401': { description: Agent token missing or invalid }
        '403': { description: Required agent scope missing }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { description: Incident storage unavailable }
  /api/v1/security/findings:
    get:
      security: [{ agentBearerAuth: [] }]
      description: Normalized, already assessed findings without raw indicator metadata.
      parameters:
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: page_size, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { in: query, name: source, schema: { type: string } }
        - { in: query, name: severity, schema: { type: string, enum: [info, low, medium, high, critical] } }
        - { in: query, name: confidence_min, schema: { type: integer, minimum: 0, maximum: 100 } }
        - { in: query, name: active, schema: { type: boolean } }
        - { in: query, name: from, schema: { type: string, format: date-time } }
        - { in: query, name: to, schema: { type: string, format: date-time } }
      responses:
        '200': { description: Paginated security finding envelope }
        '401': { description: Agent token missing or invalid }
        '403': { description: Required agent scope missing }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { description: Finding storage unavailable }
  /api/v1/security/overview:
    get:
      security: [{ agentBearerAuth: [] }]
      description: Aggregated counts from stored findings; does not calculate a new risk score.
      responses:
        '200': { description: Security overview envelope }
        '401': { description: Agent token missing or invalid }
        '403': { description: Required agent scope missing }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { description: Finding storage unavailable }
  /api/v1/network/asn:
    get:
      security: [{ agentBearerAuth: [] }]
      description: Read-only ASN intelligence records.
      parameters:
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: page_size, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { in: query, name: asn, schema: { type: string } }
        - { in: query, name: from, schema: { type: string, format: date-time } }
        - { in: query, name: to, schema: { type: string, format: date-time } }
      responses:
        '200': { description: Paginated ASN envelope }
        '401': { description: Agent token missing or invalid }
        '403': { description: Required agent scope missing }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { description: ASN storage unavailable }
  /api/v1/network/prefixes:
    get:
      security: [{ agentBearerAuth: [] }]
      description: Read-only prefixes derived from stored ASN records.
      parameters:
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: page_size, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { in: query, name: asn, schema: { type: string } }
        - { in: query, name: prefix, schema: { type: string } }
        - { in: query, name: from, schema: { type: string, format: date-time } }
        - { in: query, name: to, schema: { type: string, format: date-time } }
      responses:
        '200': { description: Paginated prefix envelope }
        '401': { description: Agent token missing or invalid }
        '403': { description: Required agent scope missing }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { description: Prefix storage unavailable }
  /api/v1/network/bgp:
    get:
      security: [{ agentBearerAuth: [] }]
      description: Read-only BGP events from the existing network intelligence layer.
      parameters:
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: page_size, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { in: query, name: asn, schema: { type: string } }
        - { in: query, name: prefix, schema: { type: string } }
        - { in: query, name: rpki_status, schema: { type: string, enum: [Valid, Invalid, Unknown] } }
        - { in: query, name: from, schema: { type: string, format: date-time } }
        - { in: query, name: to, schema: { type: string, format: date-time } }
      responses:
        '200': { description: Paginated BGP envelope }
        '401': { description: Agent token missing or invalid }
        '403': { description: Required agent scope missing }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { description: BGP storage unavailable }
  /api/v1/network/rpki:
    get:
      security: [{ agentBearerAuth: [] }]
      description: Read-only RPKI validation records.
      parameters:
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: page_size, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { in: query, name: asn, schema: { type: string } }
        - { in: query, name: prefix, schema: { type: string } }
        - { in: query, name: rpki_status, schema: { type: string, enum: [Valid, Invalid, Unknown] } }
        - { in: query, name: from, schema: { type: string, format: date-time } }
        - { in: query, name: to, schema: { type: string, format: date-time } }
      responses:
        '200': { description: Paginated RPKI envelope }
        '401': { description: Agent token missing or invalid }
        '403': { description: Required agent scope missing }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { description: RPKI storage unavailable }
  /api/v1/network/trust:
    get:
      security: [{ agentBearerAuth: [] }]
      description: Read-only trusted infrastructure status with registry internals removed.
      parameters:
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: page_size, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { in: query, name: status, schema: { type: string, enum: [Pending, Verified, Revoked] } }
        - { in: query, name: network_type, schema: { type: string } }
        - { in: query, name: from, schema: { type: string, format: date-time } }
        - { in: query, name: to, schema: { type: string, format: date-time } }
      responses:
        '200': { description: Paginated trusted infrastructure envelope }
        '401': { description: Agent token missing or invalid }
        '403': { description: Required agent scope missing }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { description: Trust registry unavailable }
  /health:
    get:
      responses:
        '200': { description: Process and configuration health }
        '503': { description: Configuration unavailable }
  /ready:
    get:
      responses:
        '200': { description: PostgreSQL and migration readiness }
        '503': { description: Not ready }
  /intelligence/indicators:
    get:
      parameters:
        - { in: query, name: page, schema: { type: integer, default: 1 } }
        - { in: query, name: page_size, schema: { type: integer, default: 100, maximum: 500 } }
        - { in: query, name: source, schema: { type: string } }
        - { in: query, name: from, schema: { type: string, format: date-time } }
        - { in: query, name: to, schema: { type: string, format: date-time } }
        - { in: query, name: severity, schema: { type: string, enum: [low, medium, high, critical] } }
        - { in: query, name: confidence, schema: { type: integer, minimum: 0, maximum: 100 } }
      responses:
        '200': { description: Paginated indicator envelope }
        '429': { $ref: '#/components/responses/RateLimited' }
  /network/asn:
    get:
      parameters:
        - { in: query, name: page, schema: { type: integer, default: 1 } }
        - { in: query, name: page_size, schema: { type: integer, default: 100, maximum: 500 } }
        - { in: query, name: asn, schema: { type: string } }
        - { in: query, name: from, schema: { type: string, format: date-time } }
        - { in: query, name: to, schema: { type: string, format: date-time } }
      responses:
        '200': { description: Paginated ASN envelope }
        '429': { $ref: '#/components/responses/RateLimited' }
  /network/bgp:
    get:
      parameters:
        - { in: query, name: page, schema: { type: integer, default: 1 } }
        - { in: query, name: page_size, schema: { type: integer, default: 100, maximum: 500 } }
        - { in: query, name: asn, schema: { type: string } }
        - { in: query, name: prefix, schema: { type: string } }
        - { in: query, name: from, schema: { type: string, format: date-time } }
        - { in: query, name: to, schema: { type: string, format: date-time } }
      responses:
        '200': { description: Paginated BGP envelope }
        '429': { $ref: '#/components/responses/RateLimited' }
  /visualization/events:
    get:
      security: [{ bearerAuth: [] }]
      description: Read-only event timeline data for all authenticated roles.
      parameters:
        - { in: query, name: page, schema: { type: integer, default: 1 } }
        - { in: query, name: page_size, schema: { type: integer, default: 50, maximum: 500 } }
        - { in: query, name: event_type, schema: { type: string } }
        - { in: query, name: source, schema: { type: string } }
        - { in: query, name: severity, schema: { type: string } }
        - { in: query, name: from, schema: { type: string, format: date-time } }
        - { in: query, name: to, schema: { type: string, format: date-time } }
      responses:
        '200': { description: Paginated event timeline envelope }
        '401': { description: Authentication required }
        '403': { description: Role denied }
        '429': { $ref: '#/components/responses/RateLimited' }
  /visualization/network:
    get:
      security: [{ bearerAuth: [] }]
      description: Read-only IP, prefix, ASN, provider, and BGP relationship graph.
      parameters:
        - { in: query, name: page, schema: { type: integer, default: 1 } }
        - { in: query, name: page_size, schema: { type: integer, default: 100, maximum: 500 } }
      responses:
        '200': { description: Paginated network graph envelope }
        '401': { description: Authentication required }
        '403': { description: Role denied }
        '429': { $ref: '#/components/responses/RateLimited' }
  /visualization/incidents:
    get:
      security: [{ bearerAuth: [] }]
      description: Read-only incident, event, indicator, ASN, and provider relationship graph.
      parameters:
        - { in: query, name: page, schema: { type: integer, default: 1 } }
        - { in: query, name: page_size, schema: { type: integer, default: 25, maximum: 100 } }
      responses:
        '200': { description: Paginated incident graph envelope }
        '401': { description: Authentication required }
        '403': { description: Role denied }
        '429': { $ref: '#/components/responses/RateLimited' }
  /visualization/trust:
    get:
      security: [{ bearerAuth: [] }]
      description: Read-only trusted infrastructure states grouped by Verified, Pending, and Revoked.
      parameters:
        - { in: query, name: page, schema: { type: integer, default: 1 } }
        - { in: query, name: page_size, schema: { type: integer, default: 50, maximum: 500 } }
      responses:
        '200': { description: Paginated trust visualization envelope }
        '401': { description: Authentication required }
        '403': { description: Role denied }
        '429': { $ref: '#/components/responses/RateLimited' }
  /incidents:
    get:
      security: [{ bearerAuth: [] }]
      description: Viewer, Operator, or Administrator.
      responses:
        '200': { description: Paginated incident envelope }
        '401': { description: Authentication required }
        '403': { description: Role denied }
        '429': { $ref: '#/components/responses/RateLimited' }
  /incidents/{id}/status:
    post:
      security: [{ bearerAuth: [] }]
      description: Operator or Administrator. Every change creates an audit event.
      responses:
        '200': { description: Status changed }
        '400': { description: Invalid lifecycle status }
        '401': { description: Authentication required }
        '403': { description: Role denied }
        '429': { $ref: '#/components/responses/RateLimited' }
  /incidents/{id}/analysis:
    get:
      security: [{ bearerAuth: [] }]
      description: Viewer, Operator, or Administrator. Returns sanitized context and stored analysis results.
      responses:
        '200': { description: Incident analysis envelope }
        '401': { description: Authentication required }
        '403': { description: Role denied }
        '404': { description: Incident not found }
        '429': { $ref: '#/components/responses/RateLimited' }
  /incidents/{id}/analysis/request:
    post:
      security: [{ bearerAuth: [] }]
      description: Operator or Administrator. Queues an optional explanation-only analysis.
      responses:
        '202': { description: Analysis accepted }
        '401': { description: Authentication required }
        '403': { description: Role denied }
        '502': { description: Analyzer unavailable or rejected the request }
        '429': { $ref: '#/components/responses/RateLimited' }
  /audit/events:
    get:
      security: [{ bearerAuth: [] }]
      description: Viewer, Operator, or Administrator with source, severity, user, and time filters.
      responses:
        '200': { description: Paginated audit envelope }
        '401': { description: Authentication required }
        '429': { $ref: '#/components/responses/RateLimited' }
  /incidents/export:
    get:
      security: [{ bearerAuth: [] }]
      description: Use format=csv for CSV; the default is the standard JSON envelope.
      responses:
        '200': { description: Incident export }
        '429': { $ref: '#/components/responses/RateLimited' }
  /intelligence/indicators/export:
    get:
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Indicator export }
        '429': { $ref: '#/components/responses/RateLimited' }
  /audit/events/export:
    get:
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Audit export }
        '429': { $ref: '#/components/responses/RateLimited' }
