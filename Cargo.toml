[workspace]
members = ["api", "worker", "intelligence", "risk", "policy", "storage", "decision", "workflow", "analyzer", "notifier", "events", "mcp", "correlation", "incidents"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "Apache-2.0"
version = "0.7.0"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
argon2 = "0.5"
chrono = { version = "0.4", features = ["serde"] }
ipnet = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
redis = { version = "0.32", default-features = false, features = ["tokio-comp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls-tls"] }
sqlx = { version = "0.8", default-features = false, features = ["chrono", "json", "macros", "migrate", "postgres", "runtime-tokio-rustls", "uuid"] }
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "time"] }
tower-http = { version = "0.6", features = ["limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["serde", "v4"] }
