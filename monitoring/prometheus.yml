global:
  scrape_interval: 15s
  evaluation_interval: 15s
scrape_configs:
  - job_name: clawforge-api
    metrics_path: /metrics
    static_configs:
      - targets: [clawforge-api:8080]
  - job_name: clawforge-mcp
    metrics_path: /metrics
    static_configs:
      - targets: [clawforge-mcp:8090]
