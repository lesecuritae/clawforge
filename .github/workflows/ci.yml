name: Clawforge CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: clawforge_test
          POSTGRES_USER: clawforge
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clawforge -d clawforge_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CLAWFORGE_TEST_DATABASE_URL: postgres://clawforge:test-password@127.0.0.1:5432/clawforge_test
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace
      - run: ./scripts/test-postgres.sh
      - run: cargo clippy --workspace --all-targets -- -D warnings

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
        # RUSTSEC-2023-0071 (rsa, via sqlx-macros-core's optional "mysql"
        # feature) has no upstream patch at any version and is not
        # actually reachable in our build: sqlx here is
        # default-features=false with only "postgres" enabled, and
        # `cargo tree -i rsa --target all` finds no edge into it - verified
        # against a full `cargo test --workspace` build log with no
        # "Compiling rsa"/"sqlx-mysql" line at all. Cargo.lock still
        # records it because lockfiles are resolved feature-union-stable
        # across the whole workspace, not just the currently active
        # feature set.
      - uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: .
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          exit-code: '1'

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Create private test secrets
        shell: bash
        run: |
          secret_dir="$RUNNER_TEMP/clawforge-secrets"
          ./scripts/init-secrets.sh "$secret_dir"
          for mapping in \
            CLAWFORGE_POSTGRES_SECRET_FILE=postgres_password \
            CLAWFORGE_DATABASE_URL_SECRET_FILE=database_url \
            CLAWFORGE_DATABASE_API_PASSWORD_SECRET_FILE=database_api_password \
            CLAWFORGE_DATABASE_API_URL_SECRET_FILE=database_api_url \
            CLAWFORGE_DATABASE_WORKER_PASSWORD_SECRET_FILE=database_worker_password \
            CLAWFORGE_DATABASE_WORKER_URL_SECRET_FILE=database_worker_url \
            CLAWFORGE_DATABASE_CORRELATION_PASSWORD_SECRET_FILE=database_correlation_password \
            CLAWFORGE_DATABASE_CORRELATION_URL_SECRET_FILE=database_correlation_url \
            CLAWFORGE_DATABASE_SECURITY_ENGINE_PASSWORD_SECRET_FILE=database_security_engine_password \
            CLAWFORGE_DATABASE_SECURITY_ENGINE_URL_SECRET_FILE=database_security_engine_url \
            CLAWFORGE_DATABASE_POLICY_ENGINE_PASSWORD_SECRET_FILE=database_policy_engine_password \
            CLAWFORGE_DATABASE_POLICY_ENGINE_URL_SECRET_FILE=database_policy_engine_url \
            CLAWFORGE_DATABASE_INCIDENTS_PASSWORD_SECRET_FILE=database_incidents_password \
            CLAWFORGE_DATABASE_INCIDENTS_URL_SECRET_FILE=database_incidents_url \
            CLAWFORGE_DATABASE_EXECUTOR_PASSWORD_SECRET_FILE=database_executor_password \
            CLAWFORGE_DATABASE_EXECUTOR_URL_SECRET_FILE=database_executor_url \
            CLAWFORGE_DATABASE_BACKUP_PASSWORD_SECRET_FILE=database_backup_password \
            CLAWFORGE_ADMIN_BOOTSTRAP_SECRET_FILE=admin_bootstrap_token \
            CLAWFORGE_ANALYZER_SECRET_FILE=analyzer_token \
            CLAWFORGE_ANALYZER_API_KEY_SECRET_FILE=analyzer_api_key \
            CLAWFORGE_NOTIFIER_SECRET_FILE=notifier_token \
            CLAWFORGE_NOTIFICATION_WEBHOOK_SECRET_FILE=notifier_webhook_auth \
            CLAWFORGE_NOTIFICATION_MATRIX_SECRET_FILE=notifier_matrix_auth \
            CLAWFORGE_NOTIFICATION_SMTP_SECRET_FILE=notifier_smtp_password \
            CLAWFORGE_EVENTS_SECRET_FILE=events_token \
            CLAWFORGE_OPERATIONS_SECRET_FILE=operations_token \
            CLAWFORGE_MCP_AGENT_TOKEN_FILE=mcp_agent_api_token \
            CLAWFORGE_MCP_AUTH_TOKEN_FILE=mcp_auth_token \
            CLAWFORGE_ANALYZER_IP_HMAC_KEY_SECRET_FILE=analyzer_ip_hmac_key \
            CLAWFORGE_GITHUB_TOKEN_FILE=github_token \
            CLAWFORGE_PROXMOX_TOKEN_FILE=proxmox_token \
            CLAWFORGE_LINUX_SENSOR_CREDENTIAL_SECRET_FILE=linux_sensor_credential \
            CLAWFORGE_HAPROXY_SENSOR_CREDENTIAL_SECRET_FILE=haproxy_sensor_credential \
            CLAWFORGE_DOCKER_SENSOR_CREDENTIAL_SECRET_FILE=docker_sensor_credential \
            CLAWFORGE_THREATFOX_SECRET_FILE=threatfox_auth_key \
            CLAWFORGE_URLHAUS_SECRET_FILE=urlhaus_auth_key \
            CLAWFORGE_MALWAREBAZAAR_SECRET_FILE=malwarebazaar_auth_key \
            CLAWFORGE_TAILSCALE_OAUTH_CLIENT_ID_SECRET_FILE=tailscale_oauth_client_id \
            CLAWFORGE_TAILSCALE_OAUTH_CLIENT_SECRET_SECRET_FILE=tailscale_oauth_client_secret; do
            printf '%s=%s/%s\n' "${mapping%%=*}" "$secret_dir" "${mapping#*=}" >> "$GITHUB_ENV"
          done
      - run: ./scripts/test-secret-hardening.sh
      - run: docker compose config --quiet
      - run: docker compose --profile observability config --quiet
      - run: docker compose --profile agent config --quiet
      - run: docker compose --profile sensors config --quiet
      - run: docker compose build

  release-images:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [rust, frontend, security, compose]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            context: .
            file: docker/Dockerfile
          - service: mcp
            context: .
            file: docker/Dockerfile
          - service: correlation
            context: .
            file: docker/Dockerfile
          - service: incidents
            context: .
            file: docker/Dockerfile
          - service: worker
            context: .
            file: docker/Dockerfile
          - service: executor
            context: .
            file: docker/Dockerfile
          - service: frontend
            context: ./frontend
            file: ./frontend/Dockerfile
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: version
        name: Derive release version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "minor=${version%.*}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/lesecuritae/clawforge-${{ matrix.service }}:${{ steps.version.outputs.version }}
            ghcr.io/lesecuritae/clawforge-${{ matrix.service }}:v${{ steps.version.outputs.version }}
            ghcr.io/lesecuritae/clawforge-${{ matrix.service }}:${{ steps.version.outputs.minor }}
            ghcr.io/lesecuritae/clawforge-${{ matrix.service }}:latest
          build-args: |
            RELEASE_VERSION=${{ steps.version.outputs.version }}
            VCS_REF=${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          sbom: true
          provenance: true
      - name: Scan published image
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ghcr.io/lesecuritae/clawforge-${{ matrix.service }}:${{ steps.version.outputs.version }}
          format: table
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          exit-code: '1'

  release-notes:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release-images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Add published images to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag \
              --title "Clawforge ${GITHUB_REF_NAME}" --notes-file RELEASE_NOTES.md
          fi
          gh release edit "$GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
