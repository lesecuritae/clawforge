services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clawforge}
      POSTGRES_USER: ${POSTGRES_USER:-clawforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - clawforge-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  clawforge-api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["/usr/local/bin/clawforge-api"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-clawforge}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-clawforge}
      RUST_LOG: ${RUST_LOG:-info}
      CLAWFORGE_API_BIND: 0.0.0.0:8080
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${CLAWFORGE_API_PORT:-8080}:8080"
    restart: unless-stopped

  clawforge-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["/usr/local/bin/clawforge-worker"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-clawforge}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-clawforge}
      RUST_LOG: ${RUST_LOG:-info}
      CLAWFORGE_WORKER_POLL_SECONDS: ${CLAWFORGE_WORKER_POLL_SECONDS:-60}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    profiles: [cache]
    volumes:
      - clawforge-redis:/data

volumes:
  clawforge-postgres:
  clawforge-redis:
