services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clawforge}
      POSTGRES_USER: ${POSTGRES_USER:-clawforge}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - clawforge-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  clawforge-migrate:
    image: ${CLAWFORGE_IMAGE_REGISTRY:-ghcr.io/lesecuritae}/clawforge-api:${CLAWFORGE_IMAGE_TAG:-v1.0.0}
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["/usr/local/bin/clawforge-migrate"]
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
    depends_on:
      postgres:
        condition: service_healthy
    secrets:
      - database_url
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: "no"

  clawforge-db-roles:
    image: postgres:16-alpine
    command: ["/bin/sh", "/usr/local/bin/provision-db-roles.sh"]
    environment:
      PGHOST: postgres
      PGPORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-clawforge}
      POSTGRES_USER: ${POSTGRES_USER:-clawforge}
    depends_on:
      clawforge-migrate:
        condition: service_completed_successfully
    secrets:
      - postgres_password
      - database_api_password
      - database_worker_password
      - database_correlation_password
      - database_security_engine_password
      - database_policy_engine_password
      - database_incidents_password
      - database_executor_password
      - database_backup_password
    volumes:
      - ./scripts/provision-db-roles.sh:/usr/local/bin/provision-db-roles.sh:ro
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: "no"

  prometheus:
    profiles: [observability]
    image: prom/prometheus:v2.55.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - clawforge-prometheus:/prometheus
    ports:
      - "${CLAWFORGE_PROMETHEUS_HOST:-127.0.0.1}:${CLAWFORGE_PROMETHEUS_PORT:-9090}:9090"
    networks:
      - backend
      - frontend
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  grafana:
    profiles: [observability]
    image: grafana/grafana:11.3.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - clawforge-grafana:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${CLAWFORGE_GRAFANA_HOST:-127.0.0.1}:${CLAWFORGE_GRAFANA_PORT:-3001}:3000"
    networks:
      - backend
      - frontend
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  clawforge-api:
    image: ${CLAWFORGE_IMAGE_REGISTRY:-ghcr.io/lesecuritae}/clawforge-api:${CLAWFORGE_IMAGE_TAG:-v1.0.0}
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["/usr/local/bin/clawforge-api"]
    environment:
      DATABASE_URL_FILE: /run/secrets/database_api_url
      RUST_LOG: ${RUST_LOG:-info}
      CLAWFORGE_API_BIND: 0.0.0.0:8080
      CLAWFORGE_ADMIN_BOOTSTRAP_USERNAME: ${CLAWFORGE_ADMIN_BOOTSTRAP_USERNAME:-admin}
      CLAWFORGE_ANALYZER_URL: ${CLAWFORGE_ANALYZER_URL:-http://clawforge-analyzer:8081}
      CLAWFORGE_ANALYZER_TOKEN_FILE: /run/secrets/analyzer_token
      CLAWFORGE_ANALYZER_ANONYMIZE_IPS: ${CLAWFORGE_ANALYZER_ANONYMIZE_IPS:-true}
      CLAWFORGE_ANALYZER_IP_HMAC_KEY_FILE: /run/secrets/analyzer_ip_hmac_key
      CLAWFORGE_NOTIFIER_TOKEN_FILE: /run/secrets/notifier_token
      CLAWFORGE_EVENTS_TOKEN_FILE: /run/secrets/events_token
      CLAWFORGE_OPERATIONS_TOKEN_FILE: /run/secrets/operations_token
      CLAWFORGE_NOTIFIER_ALLOWED_HOSTS: ${CLAWFORGE_NOTIFIER_ALLOWED_HOSTS:-}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    depends_on:
      clawforge-db-roles:
        condition: service_completed_successfully
    secrets:
      - database_api_url
      - analyzer_token
      - notifier_token
      - events_token
      - operations_token
      - analyzer_ip_hmac_key
    networks:
      - backend
      - frontend
    ports:
      - "${CLAWFORGE_API_HOST:-127.0.0.1}:${CLAWFORGE_API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/ready >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  clawforge-analyzer:
    profiles: [analysis]
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["/usr/local/bin/clawforge-analyzer"]
    environment:
      CLAWFORGE_ANALYZER_BIND: 0.0.0.0:8081
      CLAWFORGE_CORE_API_URL: ${CLAWFORGE_CORE_API_URL:-http://clawforge-api:8080}
      CLAWFORGE_ANALYZER_PROVIDER: ${CLAWFORGE_ANALYZER_PROVIDER:-mock}
      CLAWFORGE_ANALYZER_MODEL: ${CLAWFORGE_ANALYZER_MODEL:-offline}
      CLAWFORGE_ANALYZER_BASE_URL: ${CLAWFORGE_ANALYZER_BASE_URL:-}
      CLAWFORGE_ANALYZER_TIMEOUT_SECONDS: ${CLAWFORGE_ANALYZER_TIMEOUT_SECONDS:-30}
      CLAWFORGE_ANALYZER_EVENT_CONSUMER: ${CLAWFORGE_ANALYZER_EVENT_CONSUMER:-false}
      CLAWFORGE_ANALYZER_EVENT_POLL_SECONDS: ${CLAWFORGE_ANALYZER_EVENT_POLL_SECONDS:-10}
      CLAWFORGE_ANALYZER_TOKEN_FILE: /run/secrets/analyzer_token
      CLAWFORGE_ANALYZER_API_KEY_FILE: /run/secrets/analyzer_api_key
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    depends_on:
      clawforge-api:
        condition: service_healthy
    secrets:
      - analyzer_token
      - analyzer_api_key
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8081/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  clawforge-notifier:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["/usr/local/bin/clawforge-notifier"]
    environment:
      CLAWFORGE_CORE_API_URL: ${CLAWFORGE_CORE_API_URL:-http://clawforge-api:8080}
      CLAWFORGE_NOTIFIER_TOKEN_FILE: /run/secrets/notifier_token
      CLAWFORGE_NOTIFIER_POLL_SECONDS: ${CLAWFORGE_NOTIFIER_POLL_SECONDS:-5}
      CLAWFORGE_NOTIFIER_TIMEOUT_SECONDS: ${CLAWFORGE_NOTIFIER_TIMEOUT_SECONDS:-15}
      CLAWFORGE_NOTIFIER_ALLOWED_HOSTS: ${CLAWFORGE_NOTIFIER_ALLOWED_HOSTS:-}
      CLAWFORGE_NOTIFIER_WEBHOOK_SECRET_FILE: /run/secrets/notifier_webhook_auth
      CLAWFORGE_NOTIFIER_MATRIX_SECRET_FILE: /run/secrets/notifier_matrix_auth
      CLAWFORGE_NOTIFIER_SMTP_SECRET_FILE: /run/secrets/notifier_smtp_password
      RUST_LOG: ${RUST_LOG:-info}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    depends_on:
      clawforge-api:
        condition: service_healthy
    secrets:
      - notifier_token
      - notifier_webhook_auth
      - notifier_matrix_auth
      - notifier_smtp_password
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  clawforge-events:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["/usr/local/bin/clawforge-events"]
    environment:
      CLAWFORGE_CORE_API_URL: ${CLAWFORGE_CORE_API_URL:-http://clawforge-api:8080}
      CLAWFORGE_EVENTS_TOKEN_FILE: /run/secrets/events_token
      CLAWFORGE_EVENTS_POLL_SECONDS: ${CLAWFORGE_EVENTS_POLL_SECONDS:-5}
      RUST_LOG: ${RUST_LOG:-info}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    depends_on:
      clawforge-api:
        condition: service_healthy
    secrets:
      - events_token
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  clawforge-correlation:
    image: ${CLAWFORGE_IMAGE_REGISTRY:-ghcr.io/lesecuritae}/clawforge-correlation:${CLAWFORGE_IMAGE_TAG:-v1.0.0}
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["/usr/local/bin/clawforge-correlation"]
    environment:
      DATABASE_URL_FILE: /run/secrets/database_correlation_url
      CLAWFORGE_CORRELATION_POLL_SECONDS: ${CLAWFORGE_CORRELATION_POLL_SECONDS:-5}
      CLAWFORGE_CORRELATION_WINDOW_SECONDS: ${CLAWFORGE_CORRELATION_WINDOW_SECONDS:-900}
      CLAWFORGE_ANALYZER_ANONYMIZE_IPS: ${CLAWFORGE_ANALYZER_ANONYMIZE_IPS:-true}
      CLAWFORGE_ANALYZER_IP_HMAC_KEY_FILE: /run/secrets/analyzer_ip_hmac_key
      RUST_LOG: ${RUST_LOG:-info}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    depends_on:
      clawforge-db-roles:
        condition: service_completed_successfully
    secrets:
      - database_correlation_url
      - analyzer_ip_hmac_key
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  clawforge-security-engine:
    image: ${CLAWFORGE_IMAGE_REGISTRY:-ghcr.io/lesecuritae}/clawforge-security-engine:${CLAWFORGE_IMAGE_TAG:-v1.0.0}
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["/usr/local/bin/clawforge-security-engine"]
    environment:
      DATABASE_URL_FILE: /run/secrets/database_security_engine_url
      CLAWFORGE_SECURITY_ENGINE_POLL_SECONDS: ${CLAWFORGE_SECURITY_ENGINE_POLL_SECONDS:-5}
      RUST_LOG: ${RUST_LOG:-info}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    depends_on:
      clawforge-db-roles:
        condition: service_completed_successfully
    secrets:
      - database_security_engine_url
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  clawforge-policy-engine:
    image: ${CLAWFORGE_IMAGE_REGISTRY:-ghcr.io/lesecuritae}/clawforge-policy-engine:${CLAWFORGE_IMAGE_TAG:-v1.0.0}
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["/usr/local/bin/clawforge-policy-engine"]
    environment:
      DATABASE_URL_FILE: /run/secrets/database_policy_engine_url
      CLAWFORGE_POLICY_ENGINE_POLL_SECONDS: ${CLAWFORGE_POLICY_ENGINE_POLL_SECONDS:-15}
      RUST_LOG: ${RUST_LOG:-info}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    depends_on:
      clawforge-db-roles:
        condition: service_completed_successfully
    secrets:
      - database_policy_engine_url
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  clawforge-incidents:
    image: ${CLAWFORGE_IMAGE_REGISTRY:-ghcr.io/lesecuritae}/clawforge-incidents:${CLAWFORGE_IMAGE_TAG:-v1.0.0}
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["/usr/local/bin/clawforge-incidents"]
    environment:
      DATABASE_URL_FILE: /run/secrets/database_incidents_url
      CLAWFORGE_INCIDENT_POLL_SECONDS: ${CLAWFORGE_INCIDENT_POLL_SECONDS:-5}
      CLAWFORGE_ANALYZER_ANONYMIZE_IPS: ${CLAWFORGE_ANALYZER_ANONYMIZE_IPS:-true}
      CLAWFORGE_ANALYZER_IP_HMAC_KEY_FILE: /run/secrets/analyzer_ip_hmac_key
      RUST_LOG: ${RUST_LOG:-info}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    depends_on:
      clawforge-db-roles:
        condition: service_completed_successfully
    secrets:
      - database_incidents_url
      - analyzer_ip_hmac_key
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  clawforge-mcp:
    profiles: [agent]
    image: ${CLAWFORGE_IMAGE_REGISTRY:-ghcr.io/lesecuritae}/clawforge-mcp:${CLAWFORGE_IMAGE_TAG:-v1.0.0}
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["/usr/local/bin/clawforge-mcp"]
    environment:
      CLAWFORGE_AGENT_API_URL: ${CLAWFORGE_AGENT_API_URL:-http://clawforge-api:8080}
      CLAWFORGE_MCP_BIND: 0.0.0.0:8090
      CLAWFORGE_MCP_AGENT_TOKEN_FILE: /run/secrets/mcp_agent_api_token
      CLAWFORGE_MCP_AUTH_TOKEN_FILE: /run/secrets/mcp_auth_token
      CLAWFORGE_MCP_SCOPES: ${CLAWFORGE_MCP_SCOPES:-agent:operations:read,agent:operations:briefing,agent:operations:recommend,agent:operations:state,agent:context:read,agent:decision:read,agent:incident:read,agent:provider:read,agent:security:read,agent:knowledge:read,agent:workflow:read,agent:connector:read,agent:action:read,agent:execution:read}
      CLAWFORGE_MCP_UPSTREAM_TIMEOUT_SECONDS: ${CLAWFORGE_MCP_UPSTREAM_TIMEOUT_SECONDS:-10}
      # DNS-rebinding Host allowlist, in addition to the SDK's built-in
      # localhost/127.0.0.1/::1. Empty by default: an MCP client outside this
      # container's own network namespace (the common case) needs its
      # connecting authority listed here, e.g. the container's address on the
      # backend network or a dedicated hostname. Not a substitute for
      # mcp_auth_token, which remains the real access control.
      CLAWFORGE_MCP_ALLOWED_HOSTS: ${CLAWFORGE_MCP_ALLOWED_HOSTS:-}
      RUST_LOG: ${RUST_LOG:-info}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    depends_on:
      clawforge-api:
        condition: service_healthy
    secrets:
      - mcp_agent_api_token
      - mcp_auth_token
    networks:
      # `backend` is `internal: true` by design (no route to the internet, no
      # NAT-published host ports); Docker accepts a `ports:` mapping for a
      # container on it but never actually publishes it. A same-host MCP
      # client (OpenClaw's usual deployment) reaches this fixed address
      # directly over the Docker bridge instead; see CLAWFORGE_MCP_ALLOWED_HOSTS
      # above and docs/deployment.md.
      backend:
        ipv4_address: ${CLAWFORGE_MCP_BACKEND_IP:-10.77.77.90}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8090/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  clawforge-executor:
    image: ${CLAWFORGE_IMAGE_REGISTRY:-ghcr.io/lesecuritae}/clawforge-executor:${CLAWFORGE_IMAGE_TAG:-v1.0.0}
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["/usr/local/bin/clawforge-executor"]
    environment:
      DATABASE_URL_FILE: /run/secrets/database_executor_url
      CLAWFORGE_EXECUTOR_DRY_RUN: ${CLAWFORGE_EXECUTOR_DRY_RUN:-true}
      CLAWFORGE_EXECUTOR_POLL_SECONDS: ${CLAWFORGE_EXECUTOR_POLL_SECONDS:-10}
      CLAWFORGE_EXECUTOR_WORKER_NAME: ${CLAWFORGE_EXECUTOR_WORKER_NAME:-executor-primary}
      CLAWFORGE_EXECUTOR_WORKER_CAPACITY: ${CLAWFORGE_EXECUTOR_WORKER_CAPACITY:-1}
      CLAWFORGE_ANALYZER_ANONYMIZE_IPS: ${CLAWFORGE_ANALYZER_ANONYMIZE_IPS:-true}
      CLAWFORGE_ANALYZER_IP_HMAC_KEY_FILE: /run/secrets/analyzer_ip_hmac_key
      RUST_LOG: ${RUST_LOG:-info}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    depends_on:
      clawforge-db-roles:
        condition: service_completed_successfully
    secrets:
      - database_executor_url
      - analyzer_ip_hmac_key
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  clawforge-linux-sensor:
    profiles: [sensors]
    image: ${CLAWFORGE_IMAGE_REGISTRY:-ghcr.io/lesecuritae}/clawforge-api:${CLAWFORGE_IMAGE_TAG:-v1.0.0}
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["/usr/local/bin/clawforge-linux-sensor"]
    environment:
      CLAWFORGE_SECURITY_EVENTS_URL: ${CLAWFORGE_SECURITY_EVENTS_URL:-http://clawforge-api:8080}
      CLAWFORGE_LINUX_SENSOR_CREDENTIAL_FILE: /run/secrets/linux_sensor_credential
      CLAWFORGE_LINUX_SENSOR_CHECKPOINT_PATH: /var/lib/clawforge/linux-sensor/cursor
      CLAWFORGE_LINUX_SENSOR_BIND: 0.0.0.0:8095
      RUST_LOG: ${RUST_LOG:-info}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    # journalctl needs group-read access to the host's journal files, which
    # are group-owned by systemd-journal on the host, not root: this stays
    # a non-root container (UID 10001, matching every other service) with
    # that one supplementary group added, per the roadmap's "Linux benötigt
    # kein root". Verify the actual GID with `getent group systemd-journal`
    # on the host and override CLAWFORGE_JOURNAL_GID if it
    # differs from the common Debian/Ubuntu default assumed here.
    group_add:
      - "${CLAWFORGE_JOURNAL_GID:-101}"
    volumes:
      - /var/log/journal:/var/log/journal:ro
      - /run/log/journal:/run/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
      - clawforge-linux-sensor-state:/var/lib/clawforge/linux-sensor
    secrets:
      - linux_sensor_credential
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8095/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  clawforge-haproxy-sensor:
    profiles: [sensors]
    image: ${CLAWFORGE_IMAGE_REGISTRY:-ghcr.io/lesecuritae}/clawforge-api:${CLAWFORGE_IMAGE_TAG:-v1.0.0}
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["/usr/local/bin/clawforge-haproxy-sensor"]
    environment:
      CLAWFORGE_SECURITY_EVENTS_URL: ${CLAWFORGE_SECURITY_EVENTS_URL:-http://clawforge-api:8080}
      CLAWFORGE_HAPROXY_SENSOR_CREDENTIAL_FILE: /run/secrets/haproxy_sensor_credential
      CLAWFORGE_HAPROXY_SENSOR_CHECKPOINT_PATH: /var/lib/clawforge/haproxy-sensor/cursor
      CLAWFORGE_HAPROXY_SENSOR_BIND: 0.0.0.0:8096
      RUST_LOG: ${RUST_LOG:-info}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    # Same reasoning as clawforge-linux-sensor above: reads the same host
    # journal (SYSLOG_IDENTIFIER=haproxy instead of sshd), so it needs the
    # same supplementary group and read-only journal mounts, not root.
    group_add:
      - "${CLAWFORGE_JOURNAL_GID:-101}"
    volumes:
      - /var/log/journal:/var/log/journal:ro
      - /run/log/journal:/run/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
      - clawforge-haproxy-sensor-state:/var/lib/clawforge/haproxy-sensor
    secrets:
      - haproxy_sensor_credential
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8096/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  docker-socket-proxy:
    profiles: [sensors]
    image: ghcr.io/tecnativa/docker-socket-proxy:0.5.0
    environment:
      # Explicit despite matching the image's own defaults, per the
      # roadmap's "nur über eine read-only Proxy-Allowlist": EVENTS is all
      # clawforge-docker-sensor needs (the events stream already carries
      # image/name/network attributes inline); POST=0 is what makes this
      # read-only - no create/start/stop/exec/write access of any kind.
      EVENTS: 1
      PING: 1
      VERSION: 1
      POST: 0
      CONTAINERS: 0
      IMAGES: 0
      NETWORKS: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # Upstream documents --privileged as sometimes required to bind the
    # socket under enforcing SELinux/AppArmor policies. Left off by
    # default - granting it would undermine the entire point of proxying
    # the socket through a minimal, read-only allowlist in the first
    # place. If this container fails to start on a hardened host, that is
    # the trade-off to weigh explicitly, not something to grant by default.
    security_opt:
      - no-new-privileges:true
    networks:
      - backend
    restart: unless-stopped

  clawforge-docker-sensor:
    profiles: [sensors]
    image: ${CLAWFORGE_IMAGE_REGISTRY:-ghcr.io/lesecuritae}/clawforge-api:${CLAWFORGE_IMAGE_TAG:-v1.0.0}
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["/usr/local/bin/clawforge-docker-sensor"]
    environment:
      CLAWFORGE_DOCKER_SENSOR_API_URL: http://docker-socket-proxy:2375
      CLAWFORGE_DOCKER_SENSOR_HOST_LABEL: ${CLAWFORGE_DOCKER_SENSOR_HOST_LABEL:-unknown-host}
      CLAWFORGE_SECURITY_EVENTS_URL: ${CLAWFORGE_SECURITY_EVENTS_URL:-http://clawforge-api:8080}
      CLAWFORGE_DOCKER_SENSOR_CREDENTIAL_FILE: /run/secrets/docker_sensor_credential
      CLAWFORGE_DOCKER_SENSOR_CHECKPOINT_PATH: /var/lib/clawforge/docker-sensor/cursor
      CLAWFORGE_DOCKER_SENSOR_BIND: 0.0.0.0:8097
      RUST_LOG: ${RUST_LOG:-info}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    # No socket access, no supplementary group: unlike the journald
    # sensors, this one only ever speaks plain HTTP to docker-socket-proxy
    # over the backend network.
    volumes:
      - clawforge-docker-sensor-state:/var/lib/clawforge/docker-sensor
    secrets:
      - docker_sensor_credential
    depends_on:
      - docker-socket-proxy
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8097/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  clawforge-frontend:
    image: ${CLAWFORGE_IMAGE_REGISTRY:-ghcr.io/lesecuritae}/clawforge-frontend:${CLAWFORGE_IMAGE_TAG:-v1.0.0}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    entrypoint: ["nginx", "-g", "daemon off;"]
    depends_on:
      clawforge-api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,nodev,size=32m
      - /var/run:rw,noexec,nosuid,nodev,size=8m
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    networks:
      - frontend
      - backend
    ports:
      - "${CLAWFORGE_FRONTEND_HOST:-127.0.0.1}:${CLAWFORGE_FRONTEND_PORT:-3000}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  clawforge-worker:
    image: ${CLAWFORGE_IMAGE_REGISTRY:-ghcr.io/lesecuritae}/clawforge-worker:${CLAWFORGE_IMAGE_TAG:-v1.0.0}
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["/usr/local/bin/clawforge-worker"]
    environment:
      DATABASE_URL_FILE: /run/secrets/database_worker_url
      RUST_LOG: ${RUST_LOG:-info}
      CLAWFORGE_WORKER_POLL_SECONDS: ${CLAWFORGE_WORKER_POLL_SECONDS:-60}
      CLAWFORGE_ENABLE_FEEDS: ${CLAWFORGE_ENABLE_FEEDS:-false}
      CLAWFORGE_ENABLE_NETWORK: ${CLAWFORGE_ENABLE_NETWORK:-false}
      REDIS_URL: ${REDIS_URL:-}
      CLAWFORGE_SCHEDULER_LOCK_KEY: ${CLAWFORGE_SCHEDULER_LOCK_KEY:-clawforge:scheduler:lock}
      THREATFOX_AUTH_KEY_FILE: /run/secrets/threatfox_auth_key
      URLHAUS_AUTH_KEY_FILE: /run/secrets/urlhaus_auth_key
      MALWAREBAZAAR_AUTH_KEY_FILE: /run/secrets/malwarebazaar_auth_key
      CLAWFORGE_ANALYZER_ANONYMIZE_IPS: ${CLAWFORGE_ANALYZER_ANONYMIZE_IPS:-true}
      CLAWFORGE_ANALYZER_IP_HMAC_KEY_FILE: /run/secrets/analyzer_ip_hmac_key
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    depends_on:
      clawforge-db-roles:
        condition: service_completed_successfully
    secrets:
      - database_worker_url
      - threatfox_auth_key
      - urlhaus_auth_key
      - malwarebazaar_auth_key
      - analyzer_ip_hmac_key
    networks:
      - backend
      - egress
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    profiles: [cache]
    volumes:
      - clawforge-redis:/data
    networks:
      - backend

  clawforge-backup:
    image: postgres:16-alpine
    depends_on:
      clawforge-db-roles:
        condition: service_completed_successfully
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-clawforge}
      PGUSER: clawforge_backup
      BACKUP_INTERVAL_SECONDS: ${CLAWFORGE_BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${CLAWFORGE_BACKUP_RETENTION_DAYS:-14}
      CLAWFORGE_CORE_API_URL: ${CLAWFORGE_CORE_API_URL:-http://clawforge-api:8080}
    secrets:
      - database_backup_password
      - operations_token
    volumes:
      - clawforge-backups:/backups
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    command:
      - /bin/sh
      - -ec
      - |
        umask 077
        chmod 700 /backups
        export PGPASSWORD="$$(cat /run/secrets/database_backup_password)"
        notify_error() {
          reason="$${1:-backup operation failed}"
          token="$$(cat /run/secrets/operations_token)"
          escaped="$$(printf '%s' "$${reason}" | sed 's/\\/\\\\/g; s/"/\\"/g')"
          wget -q -O /dev/null --header="Authorization: Bearer $${token}" --header="Content-Type: application/json" --post-data="{\"event_type\":\"backup_error\",\"source\":\"backup\",\"severity\":\"high\",\"reason\":\"$${escaped}\",\"resource\":\"postgres\"}" "$${CLAWFORGE_CORE_API_URL}/internal/notifier/operational-events" 2>/dev/null || true
        }
        while :; do
          stamp="$$(date -u +%Y%m%dT%H%M%SZ)"
          tmp="$$(mktemp "/backups/.clawforge-$${stamp}.XXXXXX")"
          suffix="$${tmp##*.}"
          dump="/backups/clawforge-$${stamp}-$${suffix}.dump"
          if ! pg_dump --format=custom --no-owner --file="$${tmp}"; then
            rm -f "$${tmp}"
            notify_error "PostgreSQL backup failed"
            sleep "$${BACKUP_INTERVAL_SECONDS}"
            continue
          fi
          if ! pg_restore --list "$${tmp}" >/dev/null; then
            rm -f "$${tmp}"
            notify_error "PostgreSQL backup integrity check failed"
            sleep "$${BACKUP_INTERVAL_SECONDS}"
            continue
          fi
          chmod 600 "$${tmp}"
          mv "$${tmp}" "$${dump}"
          find /backups -type f -name 'clawforge-*.dump' -mtime +"$${BACKUP_RETENTION_DAYS}" -delete
          sleep "$${BACKUP_INTERVAL_SECONDS}"
        done
    restart: unless-stopped

volumes:
  clawforge-postgres:
  clawforge-redis:
  clawforge-backups:
  clawforge-prometheus:
  clawforge-grafana:
  clawforge-linux-sensor-state:
  clawforge-haproxy-sensor-state:
  clawforge-docker-sensor-state:

networks:
  frontend:
  backend:
    internal: true
    ipam:
      config:
        - subnet: ${CLAWFORGE_BACKEND_SUBNET:-10.77.77.0/24}
  # Not internal - the one path out to the real internet, for
  # clawforge-worker's threat-intel providers (Spamhaus, RIPEstat, BGPView,
  # ...) alone. Every other service stays on `backend` only, with no route
  # out at all; this network exists so that stays true even once one
  # service legitimately needs egress, rather than loosening `backend`
  # itself (which would give every service on it a path out, not just the
  # one that needs it).
  egress:

secrets:
  postgres_password:
    file: ${CLAWFORGE_POSTGRES_SECRET_FILE:?set CLAWFORGE_POSTGRES_SECRET_FILE to a private secret file}
  database_url:
    file: ${CLAWFORGE_DATABASE_URL_SECRET_FILE:?set CLAWFORGE_DATABASE_URL_SECRET_FILE to a private secret file}
  database_api_password:
    file: ${CLAWFORGE_DATABASE_API_PASSWORD_SECRET_FILE:?set CLAWFORGE_DATABASE_API_PASSWORD_SECRET_FILE to a private secret file}
  database_api_url:
    file: ${CLAWFORGE_DATABASE_API_URL_SECRET_FILE:?set CLAWFORGE_DATABASE_API_URL_SECRET_FILE to a private secret file}
  database_worker_password:
    file: ${CLAWFORGE_DATABASE_WORKER_PASSWORD_SECRET_FILE:?set CLAWFORGE_DATABASE_WORKER_PASSWORD_SECRET_FILE to a private secret file}
  database_worker_url:
    file: ${CLAWFORGE_DATABASE_WORKER_URL_SECRET_FILE:?set CLAWFORGE_DATABASE_WORKER_URL_SECRET_FILE to a private secret file}
  database_correlation_password:
    file: ${CLAWFORGE_DATABASE_CORRELATION_PASSWORD_SECRET_FILE:?set CLAWFORGE_DATABASE_CORRELATION_PASSWORD_SECRET_FILE to a private secret file}
  database_correlation_url:
    file: ${CLAWFORGE_DATABASE_CORRELATION_URL_SECRET_FILE:?set CLAWFORGE_DATABASE_CORRELATION_URL_SECRET_FILE to a private secret file}
  database_security_engine_password:
    file: ${CLAWFORGE_DATABASE_SECURITY_ENGINE_PASSWORD_SECRET_FILE:?set CLAWFORGE_DATABASE_SECURITY_ENGINE_PASSWORD_SECRET_FILE to a private secret file}
  database_security_engine_url:
    file: ${CLAWFORGE_DATABASE_SECURITY_ENGINE_URL_SECRET_FILE:?set CLAWFORGE_DATABASE_SECURITY_ENGINE_URL_SECRET_FILE to a private secret file}
  database_policy_engine_password:
    file: ${CLAWFORGE_DATABASE_POLICY_ENGINE_PASSWORD_SECRET_FILE:?set CLAWFORGE_DATABASE_POLICY_ENGINE_PASSWORD_SECRET_FILE to a private secret file}
  database_policy_engine_url:
    file: ${CLAWFORGE_DATABASE_POLICY_ENGINE_URL_SECRET_FILE:?set CLAWFORGE_DATABASE_POLICY_ENGINE_URL_SECRET_FILE to a private secret file}
  database_incidents_password:
    file: ${CLAWFORGE_DATABASE_INCIDENTS_PASSWORD_SECRET_FILE:?set CLAWFORGE_DATABASE_INCIDENTS_PASSWORD_SECRET_FILE to a private secret file}
  database_incidents_url:
    file: ${CLAWFORGE_DATABASE_INCIDENTS_URL_SECRET_FILE:?set CLAWFORGE_DATABASE_INCIDENTS_URL_SECRET_FILE to a private secret file}
  database_executor_password:
    file: ${CLAWFORGE_DATABASE_EXECUTOR_PASSWORD_SECRET_FILE:?set CLAWFORGE_DATABASE_EXECUTOR_PASSWORD_SECRET_FILE to a private secret file}
  database_executor_url:
    file: ${CLAWFORGE_DATABASE_EXECUTOR_URL_SECRET_FILE:?set CLAWFORGE_DATABASE_EXECUTOR_URL_SECRET_FILE to a private secret file}
  database_backup_password:
    file: ${CLAWFORGE_DATABASE_BACKUP_PASSWORD_SECRET_FILE:?set CLAWFORGE_DATABASE_BACKUP_PASSWORD_SECRET_FILE to a private secret file}
  threatfox_auth_key:
    file: ${CLAWFORGE_THREATFOX_SECRET_FILE:?set CLAWFORGE_THREATFOX_SECRET_FILE to a private secret file}
  urlhaus_auth_key:
    file: ${CLAWFORGE_URLHAUS_SECRET_FILE:?set CLAWFORGE_URLHAUS_SECRET_FILE to a private secret file}
  malwarebazaar_auth_key:
    file: ${CLAWFORGE_MALWAREBAZAAR_SECRET_FILE:?set CLAWFORGE_MALWAREBAZAAR_SECRET_FILE to a private secret file}
  analyzer_token:
    file: ${CLAWFORGE_ANALYZER_SECRET_FILE:?set CLAWFORGE_ANALYZER_SECRET_FILE to a private secret file}
  analyzer_api_key:
    file: ${CLAWFORGE_ANALYZER_API_KEY_SECRET_FILE:?set CLAWFORGE_ANALYZER_API_KEY_SECRET_FILE to a private secret file}
  notifier_token:
    file: ${CLAWFORGE_NOTIFIER_SECRET_FILE:?set CLAWFORGE_NOTIFIER_SECRET_FILE to a private secret file}
  events_token:
    file: ${CLAWFORGE_EVENTS_SECRET_FILE:?set CLAWFORGE_EVENTS_SECRET_FILE to a private secret file}
  operations_token:
    file: ${CLAWFORGE_OPERATIONS_SECRET_FILE:?set CLAWFORGE_OPERATIONS_SECRET_FILE to a private secret file}
  notifier_webhook_auth:
    file: ${CLAWFORGE_NOTIFICATION_WEBHOOK_SECRET_FILE:?set CLAWFORGE_NOTIFICATION_WEBHOOK_SECRET_FILE to a private secret file}
  notifier_matrix_auth:
    file: ${CLAWFORGE_NOTIFICATION_MATRIX_SECRET_FILE:?set CLAWFORGE_NOTIFICATION_MATRIX_SECRET_FILE to a private secret file}
  notifier_smtp_password:
    file: ${CLAWFORGE_NOTIFICATION_SMTP_SECRET_FILE:?set CLAWFORGE_NOTIFICATION_SMTP_SECRET_FILE to a private secret file}
  mcp_agent_api_token:
    file: ${CLAWFORGE_MCP_AGENT_TOKEN_FILE:?set CLAWFORGE_MCP_AGENT_TOKEN_FILE to a private secret file}
  mcp_auth_token:
    file: ${CLAWFORGE_MCP_AUTH_TOKEN_FILE:?set CLAWFORGE_MCP_AUTH_TOKEN_FILE to a private secret file}
  analyzer_ip_hmac_key:
    file: ${CLAWFORGE_ANALYZER_IP_HMAC_KEY_SECRET_FILE:?set CLAWFORGE_ANALYZER_IP_HMAC_KEY_SECRET_FILE to a private secret file}
  github_token:
    file: ${CLAWFORGE_GITHUB_TOKEN_FILE:?set CLAWFORGE_GITHUB_TOKEN_FILE to a private secret file}
  proxmox_token:
    file: ${CLAWFORGE_PROXMOX_TOKEN_FILE:?set CLAWFORGE_PROXMOX_TOKEN_FILE to a private secret file}
  linux_sensor_credential:
    file: ${CLAWFORGE_LINUX_SENSOR_CREDENTIAL_SECRET_FILE:?set CLAWFORGE_LINUX_SENSOR_CREDENTIAL_SECRET_FILE to a private secret file}
  haproxy_sensor_credential:
    file: ${CLAWFORGE_HAPROXY_SENSOR_CREDENTIAL_SECRET_FILE:?set CLAWFORGE_HAPROXY_SENSOR_CREDENTIAL_SECRET_FILE to a private secret file}
  docker_sensor_credential:
    file: ${CLAWFORGE_DOCKER_SENSOR_CREDENTIAL_SECRET_FILE:?set CLAWFORGE_DOCKER_SENSOR_CREDENTIAL_SECRET_FILE to a private secret file}
