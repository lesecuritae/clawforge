services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clawforge}
      POSTGRES_USER: ${POSTGRES_USER:-clawforge}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - clawforge-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  prometheus:
    profiles: [observability]
    image: prom/prometheus:v2.55.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - clawforge-prometheus:/prometheus
    ports:
      - "${CLAWFORGE_PROMETHEUS_HOST:-127.0.0.1}:${CLAWFORGE_PROMETHEUS_PORT:-9090}:9090"
    networks:
      - backend
      - frontend
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  grafana:
    profiles: [observability]
    image: grafana/grafana:11.3.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - clawforge-grafana:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${CLAWFORGE_GRAFANA_HOST:-127.0.0.1}:${CLAWFORGE_GRAFANA_PORT:-3001}:3000"
    networks:
      - backend
      - frontend
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  clawforge-api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["/usr/local/bin/clawforge-api"]
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
      RUST_LOG: ${RUST_LOG:-info}
      CLAWFORGE_API_BIND: 0.0.0.0:8080
      CLAWFORGE_ADMIN_BOOTSTRAP_TOKEN_FILE: /run/secrets/admin_bootstrap_token
      CLAWFORGE_ADMIN_BOOTSTRAP_USERNAME: ${CLAWFORGE_ADMIN_BOOTSTRAP_USERNAME:-admin}
      CLAWFORGE_ANALYZER_URL: ${CLAWFORGE_ANALYZER_URL:-http://clawforge-analyzer:8081}
      CLAWFORGE_ANALYZER_TOKEN_FILE: /run/secrets/analyzer_token
      CLAWFORGE_ANALYZER_ANONYMIZE_IPS: ${CLAWFORGE_ANALYZER_ANONYMIZE_IPS:-true}
      CLAWFORGE_NOTIFIER_TOKEN_FILE: /run/secrets/notifier_token
      CLAWFORGE_EVENTS_TOKEN_FILE: /run/secrets/events_token
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    depends_on:
      postgres:
        condition: service_healthy
    secrets:
      - database_url
      - admin_bootstrap_token
      - analyzer_token
      - notifier_token
      - events_token
    networks:
      - backend
      - frontend
    ports:
      - "${CLAWFORGE_API_HOST:-127.0.0.1}:${CLAWFORGE_API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/ready >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  clawforge-analyzer:
    profiles: [analysis]
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["/usr/local/bin/clawforge-analyzer"]
    environment:
      CLAWFORGE_ANALYZER_BIND: 0.0.0.0:8081
      CLAWFORGE_CORE_API_URL: ${CLAWFORGE_CORE_API_URL:-http://clawforge-api:8080}
      CLAWFORGE_ANALYZER_PROVIDER: ${CLAWFORGE_ANALYZER_PROVIDER:-mock}
      CLAWFORGE_ANALYZER_MODEL: ${CLAWFORGE_ANALYZER_MODEL:-offline}
      CLAWFORGE_ANALYZER_BASE_URL: ${CLAWFORGE_ANALYZER_BASE_URL:-}
      CLAWFORGE_ANALYZER_TIMEOUT_SECONDS: ${CLAWFORGE_ANALYZER_TIMEOUT_SECONDS:-30}
      CLAWFORGE_ANALYZER_EVENT_CONSUMER: ${CLAWFORGE_ANALYZER_EVENT_CONSUMER:-false}
      CLAWFORGE_ANALYZER_EVENT_POLL_SECONDS: ${CLAWFORGE_ANALYZER_EVENT_POLL_SECONDS:-10}
      CLAWFORGE_ANALYZER_TOKEN_FILE: /run/secrets/analyzer_token
      CLAWFORGE_ANALYZER_API_KEY_FILE: /run/secrets/analyzer_api_key
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    depends_on:
      clawforge-api:
        condition: service_healthy
    secrets:
      - analyzer_token
      - analyzer_api_key
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8081/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  clawforge-notifier:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["/usr/local/bin/clawforge-notifier"]
    environment:
      CLAWFORGE_CORE_API_URL: ${CLAWFORGE_CORE_API_URL:-http://clawforge-api:8080}
      CLAWFORGE_NOTIFIER_TOKEN_FILE: /run/secrets/notifier_token
      CLAWFORGE_NOTIFIER_POLL_SECONDS: ${CLAWFORGE_NOTIFIER_POLL_SECONDS:-5}
      CLAWFORGE_NOTIFIER_TIMEOUT_SECONDS: ${CLAWFORGE_NOTIFIER_TIMEOUT_SECONDS:-15}
      RUST_LOG: ${RUST_LOG:-info}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    depends_on:
      clawforge-api:
        condition: service_healthy
    secrets:
      - notifier_token
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  clawforge-events:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["/usr/local/bin/clawforge-events"]
    environment:
      CLAWFORGE_CORE_API_URL: ${CLAWFORGE_CORE_API_URL:-http://clawforge-api:8080}
      CLAWFORGE_EVENTS_TOKEN_FILE: /run/secrets/events_token
      CLAWFORGE_EVENTS_POLL_SECONDS: ${CLAWFORGE_EVENTS_POLL_SECONDS:-5}
      RUST_LOG: ${RUST_LOG:-info}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    depends_on:
      clawforge-api:
        condition: service_healthy
    secrets:
      - events_token
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  clawforge-correlation:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["/usr/local/bin/clawforge-correlation"]
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
      CLAWFORGE_CORRELATION_POLL_SECONDS: ${CLAWFORGE_CORRELATION_POLL_SECONDS:-5}
      CLAWFORGE_CORRELATION_WINDOW_SECONDS: ${CLAWFORGE_CORRELATION_WINDOW_SECONDS:-900}
      RUST_LOG: ${RUST_LOG:-info}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    depends_on:
      postgres:
        condition: service_healthy
    secrets:
      - database_url
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  clawforge-incidents:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["/usr/local/bin/clawforge-incidents"]
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
      CLAWFORGE_INCIDENT_POLL_SECONDS: ${CLAWFORGE_INCIDENT_POLL_SECONDS:-5}
      RUST_LOG: ${RUST_LOG:-info}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    depends_on:
      postgres:
        condition: service_healthy
    secrets:
      - database_url
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  clawforge-mcp:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["/usr/local/bin/clawforge-mcp"]
    environment:
      CLAWFORGE_AGENT_API_URL: ${CLAWFORGE_AGENT_API_URL:-http://clawforge-api:8080}
      CLAWFORGE_MCP_BIND: 0.0.0.0:8090
      CLAWFORGE_MCP_AGENT_TOKEN_FILE: /run/secrets/mcp_agent_api_token
      CLAWFORGE_MCP_AUTH_TOKEN_FILE: /run/secrets/mcp_auth_token
      CLAWFORGE_MCP_SCOPES: ${CLAWFORGE_MCP_SCOPES:-agent:operations:read,agent:operations:briefing,agent:operations:recommend,agent:operations:state,agent:context:read,agent:decision:read,agent:incident:read,agent:provider:read,agent:security:read,agent:knowledge:read,agent:workflow:read,agent:connector:read,agent:action:read,agent:execution:read}
      CLAWFORGE_MCP_UPSTREAM_TIMEOUT_SECONDS: ${CLAWFORGE_MCP_UPSTREAM_TIMEOUT_SECONDS:-10}
      RUST_LOG: ${RUST_LOG:-info}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    depends_on:
      clawforge-api:
        condition: service_healthy
    secrets:
      - mcp_agent_api_token
      - mcp_auth_token
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8090/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  clawforge-executor:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["/usr/local/bin/clawforge-executor"]
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
      CLAWFORGE_EXECUTOR_DRY_RUN: ${CLAWFORGE_EXECUTOR_DRY_RUN:-true}
      CLAWFORGE_EXECUTOR_POLL_SECONDS: ${CLAWFORGE_EXECUTOR_POLL_SECONDS:-10}
      RUST_LOG: ${RUST_LOG:-info}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    depends_on:
      postgres:
        condition: service_healthy
    secrets:
      - database_url
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  clawforge-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    entrypoint: ["nginx", "-g", "daemon off;"]
    depends_on:
      clawforge-api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,nodev,size=32m
      - /var/run:rw,noexec,nosuid,nodev,size=8m
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    networks:
      - frontend
      - backend
    ports:
      - "${CLAWFORGE_FRONTEND_HOST:-127.0.0.1}:${CLAWFORGE_FRONTEND_PORT:-3000}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  clawforge-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["/usr/local/bin/clawforge-worker"]
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
      RUST_LOG: ${RUST_LOG:-info}
      CLAWFORGE_WORKER_POLL_SECONDS: ${CLAWFORGE_WORKER_POLL_SECONDS:-60}
      CLAWFORGE_ENABLE_FEEDS: ${CLAWFORGE_ENABLE_FEEDS:-false}
      CLAWFORGE_ENABLE_NETWORK: ${CLAWFORGE_ENABLE_NETWORK:-false}
      REDIS_URL: ${REDIS_URL:-}
      CLAWFORGE_SCHEDULER_LOCK_KEY: ${CLAWFORGE_SCHEDULER_LOCK_KEY:-clawforge:scheduler:lock}
      THREATFOX_AUTH_KEY_FILE: /run/secrets/threatfox_auth_key
      URLHAUS_AUTH_KEY_FILE: /run/secrets/urlhaus_auth_key
      MALWAREBAZAAR_AUTH_KEY_FILE: /run/secrets/malwarebazaar_auth_key
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    depends_on:
      postgres:
        condition: service_healthy
    secrets:
      - database_url
      - threatfox_auth_key
      - urlhaus_auth_key
      - malwarebazaar_auth_key
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    profiles: [cache]
    volumes:
      - clawforge-redis:/data
    networks:
      - backend

  clawforge-backup:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-clawforge}
      PGUSER: ${POSTGRES_USER:-clawforge}
      BACKUP_INTERVAL_SECONDS: ${CLAWFORGE_BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${CLAWFORGE_BACKUP_RETENTION_DAYS:-14}
      CLAWFORGE_CORE_API_URL: ${CLAWFORGE_CORE_API_URL:-http://clawforge-api:8080}
    secrets:
      - postgres_password
      - notifier_token
    volumes:
      - clawforge-backups:/backups
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    command:
      - /bin/sh
      - -ec
      - |
        export PGPASSWORD="$$(cat /run/secrets/postgres_password)"
        notify_error() {
          reason="$${1:-backup operation failed}"
          token="$$(cat /run/secrets/notifier_token)"
          escaped="$$(printf '%s' "$${reason}" | sed 's/\\/\\\\/g; s/"/\\"/g')"
          wget -q -O /dev/null --header="Authorization: Bearer $${token}" --header="Content-Type: application/json" --post-data="{\"event_type\":\"backup_error\",\"source\":\"backup\",\"severity\":\"high\",\"reason\":\"$${escaped}\",\"resource\":\"postgres\"}" "$${CLAWFORGE_CORE_API_URL}/internal/notifier/operational-events" 2>/dev/null || true
        }
        while :; do
          stamp="$$(date -u +%Y%m%dT%H%M%SZ)"
          if ! pg_dump --format=custom --no-owner --file="/backups/clawforge-$${stamp}.dump"; then
            notify_error "PostgreSQL backup failed"
            sleep "$${BACKUP_INTERVAL_SECONDS}"
            continue
          fi
          if ! pg_restore --list "/backups/clawforge-$${stamp}.dump" >/dev/null; then
            notify_error "PostgreSQL backup integrity check failed"
          fi
          find /backups -type f -name 'clawforge-*.dump' -mtime +"$${BACKUP_RETENTION_DAYS}" -delete
          sleep "$${BACKUP_INTERVAL_SECONDS}"
        done
    restart: unless-stopped

volumes:
  clawforge-postgres:
  clawforge-redis:
  clawforge-backups:
  clawforge-prometheus:
  clawforge-grafana:

networks:
  frontend:
  backend:
    internal: true

secrets:
  postgres_password:
    file: ${CLAWFORGE_POSTGRES_SECRET_FILE:-./secrets/postgres_password.example}
  database_url:
    file: ${CLAWFORGE_DATABASE_URL_SECRET_FILE:-./secrets/database_url.example}
  threatfox_auth_key:
    file: ${CLAWFORGE_THREATFOX_SECRET_FILE:-./secrets/threatfox_auth_key.example}
  urlhaus_auth_key:
    file: ${CLAWFORGE_URLHAUS_SECRET_FILE:-./secrets/urlhaus_auth_key.example}
  malwarebazaar_auth_key:
    file: ${CLAWFORGE_MALWAREBAZAAR_SECRET_FILE:-./secrets/malwarebazaar_auth_key.example}
  admin_bootstrap_token:
    file: ${CLAWFORGE_ADMIN_BOOTSTRAP_SECRET_FILE:-./secrets/admin_bootstrap_token.example}
  analyzer_token:
    file: ${CLAWFORGE_ANALYZER_SECRET_FILE:-./secrets/analyzer_token.example}
  analyzer_api_key:
    file: ${CLAWFORGE_ANALYZER_API_KEY_SECRET_FILE:-./secrets/analyzer_api_key.example}
  notifier_token:
    file: ${CLAWFORGE_NOTIFIER_SECRET_FILE:-./secrets/notifier_token.example}
  events_token:
    file: ${CLAWFORGE_EVENTS_SECRET_FILE:-./secrets/events_token.example}
  mcp_agent_api_token:
    file: ${CLAWFORGE_MCP_AGENT_TOKEN_FILE:-./secrets/mcp_agent_api_token.example}
  mcp_auth_token:
    file: ${CLAWFORGE_MCP_AUTH_TOKEN_FILE:-./secrets/mcp_auth_token.example}
  github_token:
    file: ${CLAWFORGE_GITHUB_TOKEN_FILE:-./secrets/github_token.example}
  proxmox_token:
    file: ${CLAWFORGE_PROXMOX_TOKEN_FILE:-./secrets/proxmox_token.example}
