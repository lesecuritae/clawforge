services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clawforge}
      POSTGRES_USER: ${POSTGRES_USER:-clawforge}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - clawforge-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  clawforge-api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["/usr/local/bin/clawforge-api"]
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
      RUST_LOG: ${RUST_LOG:-info}
      CLAWFORGE_API_BIND: 0.0.0.0:8080
    depends_on:
      postgres:
        condition: service_healthy
    secrets:
      - database_url
    ports:
      - "${CLAWFORGE_API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  clawforge-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["/usr/local/bin/clawforge-worker"]
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
      RUST_LOG: ${RUST_LOG:-info}
      CLAWFORGE_WORKER_POLL_SECONDS: ${CLAWFORGE_WORKER_POLL_SECONDS:-60}
    depends_on:
      postgres:
        condition: service_healthy
    secrets:
      - database_url
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    profiles: [cache]
    volumes:
      - clawforge-redis:/data

volumes:
  clawforge-postgres:
  clawforge-redis:

secrets:
  postgres_password:
    file: ${CLAWFORGE_POSTGRES_SECRET_FILE:-./secrets/postgres_password.example}
  database_url:
    file: ${CLAWFORGE_DATABASE_URL_SECRET_FILE:-./secrets/database_url.example}
